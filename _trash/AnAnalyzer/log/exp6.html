<CENTER>サーチエンジン解析2<BR>（キーワード検索されたもののみ）<BR>※シェアウエア登録後に利用可能になります</CENTER><BR>

キーワード検索を使ってアクセスされたサーチエンジンのランキングです。<BR>
<BR>
グラフ横の数字がアクセス数（比率%）です。比率は表示のサーチエンジン間のシェアになります。データには<a href="exp15.html">解析有効データ</A>を使っています。<BR>
<BR>
ページ、キーワード、日にちを特定して詳細に分析することができます。<BR>
<BR>
グラフ横の数字をクリックすると、そのデータを含んだ最新のアクセスデータを見ることができます。
