<CENTER>ページごとアクセス数解析</CENTER><BR>

ページ毎のアクセスランキングです。グラフ横の数字がアクセス数（比率%）です。<BR>
<BR>
利用されたサーチエンジン（※）、キーワード（※）、日にちを特定して詳細に分析することができます。<BR>
キーワードは、サーチエンジンで検索に利用されたものを一覧にしています。キーワードで絞り込むとそのキーワードで検索されたページのアクセス状況が表示されます。<BR>
<BR>
グラフ横の数字をクリックすると、そのデータを含んだ最新のアクセスデータを見ることができます。<BR>
<BR>
<FONT SIZE=-1>※シェアウエア登録後に利用可能になります。</FONT>
